version: '3.8'

services:
  # Config Servers (Replica Set)
  config1:
    image: mongo:6.0
    container_name: mongo_config1
    command: --configsvr --replSet configReplSet --bind_ip_all --port 27019
    ports:
      - "27019:27019"
    volumes:
      - config1_data:/data/db
    networks:
      - mongo-net
    restart: always

  config2:
    image: mongo:6.0
    container_name: mongo_config2
    command: --configsvr --replSet configReplSet --bind_ip_all --port 27019
    ports:
      - "27020:27019"
    volumes:
      - config2_data:/data/db
    networks:
      - mongo-net
    restart: always

  config3:
    image: mongo:6.0
    container_name: mongo_config3
    command: --configsvr --replSet configReplSet --bind_ip_all --port 27019
    ports:
      - "27021:27019"
    volumes:
      - config3_data:/data/db
    networks:
      - mongo-net
    restart: always

  # Shard 1 (Replica Set)
  shard1_1:
    image: mongo:6.0
    container_name: mongo_shard1_1
    command: --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27018
    ports:
      - "27022:27018"
    volumes:
      - shard1_1_data:/data/db
    networks:
      - mongo-net
    restart: always

  shard1_2:
    image: mongo:6.0
    container_name: mongo_shard1_2
    command: --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27018
    ports:
      - "27023:27018"
    volumes:
      - shard1_2_data:/data/db
    networks:
      - mongo-net
    restart: always

  shard1_3:
    image: mongo:6.0
    container_name: mongo_shard1_3
    command: --shardsvr --replSet shard1ReplSet --bind_ip_all --port 27018
    ports:
      - "27024:27018"
    volumes:
      - shard1_3_data:/data/db
    networks:
      - mongo-net
    restart: always

  # Shard 2 (Replica Set)
  shard2_1:
    image: mongo:6.0
    container_name: mongo_shard2_1
    command: --shardsvr --replSet shard2ReplSet --bind_ip_all --port 27018
    ports:
      - "27025:27018"
    volumes:
      - shard2_1_data:/data/db
    networks:
      - mongo-net
    restart: always

  shard2_2:
    image: mongo:6.0
    container_name: mongo_shard2_2
    command: --shardsvr --replSet shard2ReplSet --bind_ip_all --port 27018
    ports:
      - "27026:27018"
    volumes:
      - shard2_2_data:/data/db
    networks:
      - mongo-net
    restart: always

  shard2_3:
    image: mongo:6.0
    container_name: mongo_shard2_3
    command: --shardsvr --replSet shard2ReplSet --bind_ip_all --port 27018
    ports:
      - "27027:27018"
    volumes:
      - shard2_3_data:/data/db
    networks:
      - mongo-net
    restart: always

  # Shard 3 (Replica Set)
  shard3_1:
    image: mongo:6.0
    container_name: mongo_shard3_1
    command: --shardsvr --replSet shard3ReplSet --bind_ip_all --port 27018
    ports:
      - "27028:27018"
    volumes:
      - shard3_1_data:/data/db
    networks:
      - mongo-net
    restart: always

  shard3_2:
    image: mongo:6.0
    container_name: mongo_shard3_2
    command: --shardsvr --replSet shard3ReplSet --bind_ip_all --port 27018
    ports:
      - "27029:27018"
    volumes:
      - shard3_2_data:/data/db
    networks:
      - mongo-net
    restart: always

  shard3_3:
    image: mongo:6.0
    container_name: mongo_shard3_3
    command: --shardsvr --replSet shard3ReplSet --bind_ip_all --port 27018
    ports:
      - "27030:27018"
    volumes:
      - shard3_3_data:/data/db
    networks:
      - mongo-net
    restart: always

  # Mongos Routers
  mongos1:
    image: mongo:6.0
    container_name: mongo_mongos1
    entrypoint: mongos
    command: --configdb configReplSet/config1:27019,config2:27019,config3:27019 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    depends_on:
      - config1
      - config2
      - config3
      - shard1_1
      - shard1_2
      - shard1_3
      - shard2_1
      - shard2_2
      - shard2_3
      - shard3_1
      - shard3_2
      - shard3_3
    networks:
      - mongo-net
    restart: always

  mongos2:
    image: mongo:6.0
    container_name: mongo_mongos2
    entrypoint: mongos
    command: --configdb configReplSet/config1:27019,config2:27019,config3:27019 --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    depends_on:
      - config1
      - config2
      - config3
      - shard1_1
      - shard1_2
      - shard1_3
      - shard2_1
      - shard2_2
      - shard2_3
      - shard3_1
      - shard3_2
      - shard3_3
    networks:
      - mongo-net
    restart: always

  # Initialization service
  init-mongo:
    image: mongo:6.0
    container_name: mongo_init
    depends_on:
      - mongos1
    networks:
      - mongo-net
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
    command: ["/docker-entrypoint-initdb.d/init.sh"]
    restart: "no"

volumes:
  config1_data:
  config2_data:
  config3_data:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
  shard3_1_data:
  shard3_2_data:
  shard3_3_data:

networks:
  mongo-net:
    driver: bridge