scope: citus_cluster
name: citus_coordinator

restapi:
  listen: 0.0.0.0:8008
  connect_address: citus_coordinator:8008

etcd3:
  hosts: etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_keep_segments: 8
        max_wal_senders: 10
        max_replication_slots: 10
        checkpoint_segments: 8
        archive_mode: on
        archive_command: 'wal-g wal-push %p'
      recovery_conf:
        restore_command: cp ../wal_archive/%f %p
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: citus_coordinator:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/14/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: replpassword
    superuser:
      username: postgres
      password: mypassword
  parameters:
    unix_socket_directories: '/var/run/postgresql'
    shared_preload_libraries: 'citus'

tags:
    nofailover: false
    noloadbalance: false
    clonefrom: false
    nosync: false