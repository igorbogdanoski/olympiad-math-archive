version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: citus-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
    command: etcd --data-dir /etcd-data --name etcd --initial-advertise-peer-urls http://etcd:2380 --listen-peer-urls http://0.0.0.0:2380 --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379 --initial-cluster etcd=http://etcd:2380

  citus_coordinator:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_DB: olympiad_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      PATRONI_NAME: citus_coordinator
      PATRONI_SCOPE: citus_cluster
      PATRONI_RESTAPI_CONNECT_ADDRESS: citus_coordinator:8008
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: citus_coordinator:5432
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpassword
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: mypassword
      PATRONI_ADMIN_USERNAME: admin
      PATRONI_ADMIN_PASSWORD: adminpassword
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONFIG_OVERRIDES: |
        shared_preload_libraries: 'citus'
        citus.node_conninfo: 'sslmode=require'
      PATRONI_TAGS: |
        nofailover: false
        noloadbalance: false
        clonefrom: false
        nosync: false
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - coordinator_data:/var/lib/postgresql/data
    depends_on:
      - etcd
    command: patroni /etc/patroni/patroni.yml

  citus_worker1:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_DB: olympiad_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      PATRONI_NAME: citus_worker1
      PATRONI_SCOPE: citus_cluster
      PATRONI_RESTAPI_CONNECT_ADDRESS: citus_worker1:8009
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8009
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: citus_worker1:5433
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5433
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpassword
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: mypassword
      PATRONI_ADMIN_USERNAME: admin
      PATRONI_ADMIN_PASSWORD: adminpassword
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONFIG_OVERRIDES: |
        shared_preload_libraries: 'citus'
        citus.node_conninfo: 'sslmode=require'
      PATRONI_TAGS: |
        nofailover: false
        noloadbalance: false
        clonefrom: false
        nosync: false
    ports:
      - "5433:5433"
      - "8009:8009"
    volumes:
      - worker1_data:/var/lib/postgresql/data
      - ./patroni_worker.yml:/etc/patroni/patroni.yml
    depends_on:
      - etcd
      - citus_coordinator
    command: patroni /etc/patroni/patroni.yml

  citus_worker2:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_DB: olympiad_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      PATRONI_NAME: citus_worker2
      PATRONI_SCOPE: citus_cluster
      PATRONI_RESTAPI_CONNECT_ADDRESS: citus_worker2:8010
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8010
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: citus_worker2:5434
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5434
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpassword
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: mypassword
      PATRONI_ADMIN_USERNAME: admin
      PATRONI_ADMIN_PASSWORD: adminpassword
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONFIG_OVERRIDES: |
        shared_preload_libraries: 'citus'
        citus.node_conninfo: 'sslmode=require'
      PATRONI_TAGS: |
        nofailover: false
        noloadbalance: false
        clonefrom: false
        nosync: false
    ports:
      - "5434:5434"
      - "8010:8010"
    volumes:
      - worker2_data:/var/lib/postgresql/data
      - ./patroni_worker.yml:/etc/patroni/patroni.yml
    depends_on:
      - etcd
      - citus_coordinator
    command: patroni /etc/patroni/patroni.yml

  citus_worker3:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_DB: olympiad_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      PATRONI_NAME: citus_worker3
      PATRONI_SCOPE: citus_cluster
      PATRONI_RESTAPI_CONNECT_ADDRESS: citus_worker3:8011
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8011
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: citus_worker3:5435
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5435
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpassword
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: mypassword
      PATRONI_ADMIN_USERNAME: admin
      PATRONI_ADMIN_PASSWORD: adminpassword
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_CONFIG_OVERRIDES: |
        shared_preload_libraries: 'citus'
        citus.node_conninfo: 'sslmode=require'
      PATRONI_TAGS: |
        nofailover: false
        noloadbalance: false
        clonefrom: false
        nosync: false
    ports:
      - "5435:5435"
      - "8011:8011"
    volumes:
      - worker3_data:/var/lib/postgresql/data
      - ./patroni_worker.yml:/etc/patroni/patroni.yml
    depends_on:
      - etcd
      - citus_coordinator
    command: patroni /etc/patroni/patroni.yml

  pgbouncer:
    image: edoburu/pgbouncer:1.18
    environment:
      PGBOUNCER_DATABASE: olympiad_core
      PGBOUNCER_USER: postgres
      PGBOUNCER_PASSWORD: mypassword
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      - citus_coordinator
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
    command: pgbouncer /etc/pgbouncer/pgbouncer.ini

volumes:
  etcd_data:
  coordinator_data:
  worker1_data:
  worker2_data:
  worker3_data: