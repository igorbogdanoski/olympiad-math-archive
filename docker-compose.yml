version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: math_mongo
    ports:
      - "27035:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: math_redis
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: math_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./videos:/app/videos
      - ./worksheets:/app/worksheets
      - ./problems:/problems
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - GENAI_API_KEY=${GENAI_API_KEY}
    depends_on:
      - mongo
      - redis

  worker:
    build: ./backend
    container_name: math_worker
    command: celery -A celery_worker worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./videos:/app/videos
      - ./worksheets:/app/worksheets
      - ./problems:/problems
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - GENAI_API_KEY=${GENAI_API_KEY}
    depends_on:
      - redis
      - api

volumes:
  mongo_data:
