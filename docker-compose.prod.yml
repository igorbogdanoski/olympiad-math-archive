services:
  mongo:
    image: mongo:latest
    container_name: math_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: math_redis
    restart: always
    networks:
      - app_network

  api:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: math_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongo
      - redis
    env_file:
      - backend/.env
    networks:
      - app_network

  worker:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: math_worker
    restart: always
    command: celery -A main.celery worker --loglevel=info
    depends_on:
      - mongo
      - redis
    env_file:
      - backend/.env
    networks:
      - app_network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: math_frontend
    restart: always
    environment:
      - PUBLIC_API_URL=https://api.mismath.net
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
    networks:
      - app_network

  caddy:
    image: caddy:latest
    container_name: math_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
